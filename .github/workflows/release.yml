name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  release:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned tools
        uses: aquaproj/aqua-installer@96a9bc20066c5bf5e275b41019cfc165b25f4e2e # v4.0.5
        with:
          aqua_version: v2.62.3
          enable_aqua_install: true
          aqua_opts: ""

      - name: Build without publishing
        run: goreleaser release --clean --skip=publish
        env:
          GORELEASER_CURRENT_TAG: ${{ env.RELEASE_TAG }}

      - name: Verify checksums and version
        run: >-
          bash script/verify-release-artifacts.sh
          "$RELEASE_TAG" dist tnnl_linux_amd64.tar.gz

      - name: Publish the verified files
        run: >-
          gh release upload "$RELEASE_TAG"
          dist/tnnl_*.tar.gz dist/checksums.txt
          --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
